[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "adaptive-coding-agent"
version = "0.1.0"
description = "A traceable coding worker with bounded recovery supervision"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2", "radon>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/coding_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
