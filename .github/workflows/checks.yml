name: checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_complexity.py
      - run: uv run pytest
      - run: uv build
  sdk-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv venv .venv-eval
      - run: uv pip install --python .venv-eval/bin/python -e . 'harbor==0.22.0' 'modal==1.5.5'
      - run: .venv-eval/bin/python -m unittest discover -s tests -p test_integrations.py -v
